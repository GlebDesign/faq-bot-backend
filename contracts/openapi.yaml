        name: Помощник
    AgentUpdate:
      description: NUL и непарные UTF-16 escapes запрещены; корректные surrogate pairs и literal U+FFFD сохраняются. Полная тройка name/website/description обязательна; пропуск и null отклоняются, пустые website/description допустимы. PATCH повышает revision; knowledge/config revisions не меняет. Replay проверяется до If-Match stale check; If-Match входит в payload hash. Общий технический предел тела 1048576 байт UTF-8.
