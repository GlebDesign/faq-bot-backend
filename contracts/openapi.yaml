      description: Запрос принят или находится в обработке. Повтор возвращает исходные ID и сохранённое состояние.
      headers:
        Cache-Control:
          required: true
          schema:
            enum:
              - no-store
            type: string
        Retry-After:
          schema:
            type: string
        X-Request-ID:
          schema:
            type: string
  securitySchemes:
    AuthSessionCookie:
      type: apiKey
      in: cookie
      name: faqbot_session
      description: Предварительная или кабинетная сессия для login/register/logout; нужны её CSRF, точный Origin и действующий токен. Logout не требует membership.
    CabinetIdentity:
      type: apiKey
      in: cookie
      name: faqbot_session
      description: Непрозрачная Go-сессия; HttpOnly/Secure/SameSite=Lax, без Domain. Актуальная локальная membership обязательна. Изменения требуют X-CSRF-Token и точного Origin. Owner не получает platform permissions.
    WidgetSession:
      type: http
      scheme: bearer
      description: Короткоживущий scoped token только виджета; account+agent+conversation из доверенной сессии.
    PartnerServer:
      type: apiKey
      in: header
      name: X-Partner-Signature
      description: 'PLACEHOLDER BE-055: server signature вместе с partner_id/key_id/timestamp/nonce/body hash. Алгоритм не выбран; не включать endpoint до ADR.'
    CabinetCSRF:
      description: CSRF проверенной кабинетной cookie; применяется вместе с точным Origin.
      in: header
      name: X-CSRF-Token
      type: apiKey
    CabinetOrigin:
      description: Точное совпадение с AUTH_ORIGIN; не самостоятельная авторизация.
      in: header
      name: Origin
      type: apiKey
