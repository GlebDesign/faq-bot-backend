        csrf_token: {type: string, minLength: 1, maxLength: 128}
      example: {csrf_token: fixture-csrf-not-a-credential}
    AuthIdentity:
      type: object
      additionalProperties: false
      required: [user_id, account_id, role, audit_read]
      properties:
        user_id: {type: string, minLength: 1, maxLength: 80}
        account_id: {type: string, minLength: 1, maxLength: 80}
