    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: CSRF текущей cookie-сессии; после входа использовать новое значение.
    AuthOrigin:
      name: Origin
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Должен в точности совпадать с AUTH_ORIGIN, включая схему и порт.
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: Сервер возвращает входной ASCII ID по шаблону [A-Za-z0-9_-]{1,80}; отсутствующий или неверный ID заменяет новым. Не предоставляет права.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
      description: CRUD агентов повторяет проверку cookie-сессии и роли до SQL replay. Scope — account+actor+operation+resource; результат и ID исходные, конфликт payload — 409. PATCH включает If-Match в hash и проверяет replay до устаревшей revision. DELETE не требует If-Match; 202 Job pending означает durable cleanup request и tombstone в одной транзакции с аудитом, без запущенного worker; новый ключ для tombstone возвращает 404. Проектируемые бизнес-операции повторяются только после новой проверки прав. Для чата scope — доверенные account+agent+visitor/member+operation; conversation_id, текст message входят в SHA-256 значимого payload; серверные candidate ID и stream как способ доставки не меняют операцию. Тот же key/payload возвращает исходный operation ID, state и terminal result; другой payload — 409 idempotency_conflict. Незавершённая операция возвращает сохранённый state без повторной генерации; кабинетный HTTP для accepted/generating использует 202 ChatOperation и Retry-After. Создание кабинетного диалога повторяется в scope account+agent+member. Для остальных операций scope — account+actor+operation+resource. Срок хранения replay и правила списания, резервирования и возврата обращений требуют BE-029/SRE-027. Auth исключён. Первичная выдача widget session исключена; token-response replay не выполняется.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
        pattern: ^"[1-9][0-9]*"$
      description: Quoted revision from ETag; stale revision returns 412 revision_conflict.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: 'Opaque cursor bound to account, resource, sort and filters. Stable order created_at DESC,id DESC. Invalid cursor: 400. No further page: next_cursor=null.'
