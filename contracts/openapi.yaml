  schemas:
    AuthCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 1, x-maxBytes: 254, description: "net/mail.ParseAddress; адрес без display name; максимум 254 байта UTF-8"}
        password: {type: string, minLength: 1, x-maxBytes: 1024, description: "От 1 до 1024 байт UTF-8; maxLength считает символы и не заменяет проверку байтов"}
      example: {email: fixture@example.invalid, password: fixture-password}
    AuthCSRF:
      type: object
      additionalProperties: false
      required: [csrf_token]
