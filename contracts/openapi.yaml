openapi: 3.0.3
info:
  title: FAQ Bot — кабинет и виджет
  version: 1.0.0-draft.4
  description: 'BE-002. Canonical REST DTO. Draft: BE-001 использует Go session cookie и CSRF; кабинетная identity проверяется через локальную membership. BE-055 signature и BE-058 consent требуют отдельных решений. account_id = tenant_id, project = agent. Без checkout, SMTP и публичного Python/LLM. Проектируемый Go API должен проверять scope и audit write-in-tx. Числовые revisions int64. Лимиты проектируемых операций — предложения BE-002 для review; Auth фиксирует фактические byte limits.'
servers:
  - url: https://api.example.invalid
paths:
  "/api/v1/auth/csrf":
    get:
      operationId: authCsrf
      x-implementation-status: implemented
      summary: Получить CSRF и предсессию
      tags: [auth]
      security: []
      description: >-
        Auth исключён из Idempotency-Key: ответы с cookie/CSRF не сохраняются для replay. Provider tokens и пароль не возвращаются. Account scope определяется локальной membership, account_id от клиента не принимается.
      parameters:
        - "$ref": "#/components/parameters/RequestID"
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-ID:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, enum: [no-store]}
              required: true
            Set-Cookie:
              description: faqbot_session; Path=/; HttpOnly; Secure; SameSite=Lax; без Domain. HTTP разрешён только явно в development. Logout удаляет cookie.
              schema: {type: string}
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthCSRF"
        '403':
          "$ref": "#/components/responses/403"
        '429':
          "$ref": "#/components/responses/429"
        '500':
          "$ref": "#/components/responses/500"
        '405':
          "$ref": "#/components/responses/405"
