    AgentCreate:
      description: Все три поля обязательны, null, NUL, непарные UTF-16 escapes и неизвестные поля запрещены. Имя 1..100 Unicode символов и не только White_Space; строки не нормализуются. website — обычный текст, без URL/network проверки. Общий технический предел тела 1048576 байт UTF-8.
      type: object
      additionalProperties: false
      required:
