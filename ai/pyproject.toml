[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faq-bot-ai-prototype"
version = "0.1.0"
description = "Local, scoped FAQ RAG prototype using LangChain and Ollama"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1,<2",
  "langchain-ollama>=1,<2",
  "langchain-text-splitters>=1,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
faq-ai = "faq_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
