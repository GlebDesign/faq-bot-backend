[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faq-bot-ai-prototype"
version = "0.1.0"
description = "Local, scoped FAQ RAG prototype using LangChain and Ollama"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1,<2",
  "langchain-ollama>=1,<2",
  "langchain-text-splitters>=1,<2",
  "pydantic>=2,<3",
  "grpcio>=1.85.3,<2",
  "grpcio-tools>=1.85.3,<2",
  "grpcio-health-checking>=1.85.3,<2",
  "psycopg[binary]>=3.3,<4",
  "pika>=1.5,<2",
  "pypdf>=7.1,<8",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
faq-ai = "faq_ai.cli:main"
faq-ai-grpc = "faq_ai.grpc_server:main"
faq-ai-worker = "faq_ai.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated PostgreSQL/RabbitMQ integration environment"]
