name: Docker backend

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: faq-bot-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SERGEY_LOGIN }}
          password: ${{ secrets.SERGEY_PASSWORD }}

      - name: Normalize Docker Hub namespace
        env:
          LOGIN: ${{ secrets.SERGEY_LOGIN }}
        run: |
          namespace="$(printf '%s' "$LOGIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$namespace" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
            echo "::error::SERGEY_LOGIN must be a Docker Hub username (not an email)"
            exit 1
          fi
          echo "DOCKERHUB_NAMESPACE=$namespace" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
